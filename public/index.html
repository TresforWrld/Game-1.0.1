<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quick Quiz Game</title>
<style>
  body {
    font-family: Arial, sans-serif;
    text-align: center;
    margin: 40px 10px 110px;
    background: #f0f8ff;
    color: #222;
  }
  h1 { margin-bottom: 6px; }
  button, select {
    padding: 10px 18px;
    font-size: 15px;
    margin-top: 10px;
    cursor: pointer;
  }
  input[type="text"], input[type="number"] {
    font-size: 16px;
    padding: 6px;
    width: 120px;
  }
  #score, #highScore, #rank, #pointsToNext {
    font-weight: 700;
  }
  #feedback { min-height: 1.4em; margin-top: 10px; }
  #leaderboard {
    margin-top: 18px;
    text-align: left;
    display: inline-block;
    width: 260px;
  }
  footer {
    background: #808080;
    color: #fff;
    padding: 12px;
    font-size: 13px;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    box-sizing: border-box;
  }
  .top-row {
    display: flex;
    justify-content: center;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  @media (max-width: 420px) {
    #leaderboard { width: 92%; }
    input[type="text"], input[type="number"] { width: 86%; }
  }
</style>
</head>
<body>
<h1>Quick Quiz Game</h1>

<!-- Login area -->
<div id="loginArea" class="top-row"></div>

<!-- Subject selection -->
<div class="top-row">
  <label for="subject">Choose subject:</label>
  <select id="subject" disabled>
    <option value="advancedmathematics">Advanced Mathematics</option>
    <option value="biology">Biology</option>
    <option value="chemistry">Chemistry</option>
    <option value="geography">Geography</option>
    <option value="history">History</option>
    <option value="ict">ICT</option>
    <option value="literature">Literature</option>
    <option value="physics">Physics</option>
    <option value="psychologyfacts">Psychology Facts</option>
    <option value="gk">General Knowledge</option>
    <option value="math">Math</option>
  </select>
</div>

<!-- Question display -->
<p id="questionTitle">Solve the problem:</p>
<h2 id="question">Loading…</h2>

<!-- Answer input -->
<input id="answer" placeholder="Your answer" disabled>
<br>
<button id="submitBtn" onclick="checkAnswer()" disabled>Submit</button>

<!-- Feedback -->
<p id="feedback"></p>

<!-- Score display -->
<p>Score: <span id="score">0</span> &nbsp;|&nbsp; High Score: <span id="highScore">0</span></p>

<!-- Rank display -->
<p>Rank: <span id="rank">—</span> &nbsp;|&nbsp; Points to next: <span id="pointsToNext">—</span></p>

<!-- Leaderboard -->
<div id="leaderboard">
  <h3 style="margin:6px 0 8px 0;">Leaderboard</h3>
  <ol id="leaderboardList" style="padding-left:1.2em;"></ol>
</div>

<!-- Footer -->
<footer style="text-align:center; padding:12px; font-size:13px; background:#808080; color:#fff;">
  ©2025 ANICADE ⛩️ Productions (ANICADE's ELEVATE)<br>

  <a href="mailto:animewrldwarsanicade@gmail.com?subject=Support%20Request&body=Hi%2C%0AI%20need%20help%20with%20the%20Quick%20Quiz%20Game.%0A%0AThanks!" 
     style="color:#d3d3d3; text-decoration:underline; margin-right:15px; font-weight:500;">
    Support
  </a>

  <a href="mailto:animewrldwarsanicade@gmail.com?subject=Report%20a%20Problem&body=Hi%2C%0AI%20want%20to%20report%20an%20issue%20with%20the%20Quick%20Quiz%20Game.%0A%0AThanks!" 
     style="color:#d3d3d3; text-decoration:underline; margin-right:15px; font-weight:500;">
    Report a Problem
  </a>

  <a href="mailto:animewrldwarsanicade@gmail.com?subject=General%20Inquiry&body=Hi%2C%0AI%20have%20a%20question%20or%20message%20about%20the%20Quick%20Quiz%20Game.%0A%0AThanks!" 
     style="color:#d3d3d3; text-decoration:underline; font-weight:500;">
    Contact
  </a>
</footer>

<script>
/* DOM */
const questionEl = document.getElementById('question');
const answerInput = document.getElementById('answer');
const submitBtn = document.getElementById('submitBtn');
const subjectSelect = document.getElementById('subject');
const scoreEl = document.getElementById('score');
const highScoreEl = document.getElementById('highScore');
const rankEl = document.getElementById('rank');
const nextEl = document.getElementById('pointsToNext');
const feedbackEl = document.getElementById('feedback');
const leaderboardList = document.getElementById('leaderboardList');
const loginArea = document.getElementById('loginArea');

/* STATE */
let ranks = [];
let questions = [];
let currentQuestion = null;

let currentRankIndex = parseInt(localStorage.getItem('rankIndex')) || 0;
let score = parseInt(localStorage.getItem('score')) || 0;
let highScore = parseInt(localStorage.getItem('highScore')) || 0;
let username = null;

/* UI */
function setUIEnabled(enabled){
  answerInput.disabled = !enabled;
  submitBtn.disabled = !enabled;
  subjectSelect.disabled = !enabled;
}

/* DISPLAY */
function updateDisplay(){
  scoreEl.textContent = score;
  highScoreEl.textContent = highScore;
  rankEl.textContent = ranks[currentRankIndex]?.name || '—';
  const needed = ranks[currentRankIndex]?.points;
  nextEl.textContent = typeof needed === 'number' ? Math.max(0, needed - score) : '—';
}

function sanitizeRankIndex(){
  if (!Array.isArray(ranks) || !ranks.length) currentRankIndex = 0;
  if (currentRankIndex < 0 || currentRankIndex >= ranks.length) currentRankIndex = 0;
}

/* SAVE USER */
async function saveUser(){
  localStorage.setItem('score', score);
  localStorage.setItem('highScore', highScore);
  localStorage.setItem('rankIndex', currentRankIndex);
  if (!username) return;

  try {
    await fetch('/update-score',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ username, score: highScore, rankIndex: currentRankIndex })
    });
  } catch(e){}
}

/* LOGIN */
function createLoginControls(){
  loginArea.innerHTML='';
  const saved = localStorage.getItem('quiz_username') || '';

  const input=document.createElement('input');
  input.placeholder='username';
  input.value=saved;

  const btn=document.createElement('button');
  btn.textContent=saved?'Use saved / Switch':'Login';

  btn.onclick=()=>{
    if(!input.value.trim()) return alert('Enter username');
    username=input.value.trim();
    localStorage.setItem('quiz_username',username);
    loginArea.innerHTML=`Logged in as: <strong>${escapeHtml(username)}</strong>`;
    saveUser();
  };

  loginArea.append(input,btn);

  if(saved){
    username=saved;
    loginArea.innerHTML=`Logged in as: <strong>${escapeHtml(username)}</strong>`;
  }
}

/* QUESTIONS — FIXED & SAFE */
async function loadQuestions(){
  try{
    const res = await fetch('./questions.json', { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP error');

    questions = await res.json();
    if(!Array.isArray(questions) || !questions.length)
      throw new Error('No questions');

    setUIEnabled(true);
    nextQuestion();

  }catch(err){
    console.error(err);
    questionEl.textContent='Failed to load questions.';
  }
}

function nextQuestion(){
  currentQuestion = questions[Math.floor(Math.random()*questions.length)];
  questionEl.textContent = currentQuestion.question;
  answerInput.value='';
  feedbackEl.textContent='';
}

function checkAnswer(){
  if(!currentQuestion) return;

  const user = answerInput.value.trim().toLowerCase();
  const correct = String(currentQuestion.answer).trim().toLowerCase();

  if(user===correct){
    score++;
    highScore=Math.max(highScore,score);
    feedbackEl.textContent='✅ Correct!';
  }else{
    score=0;
    feedbackEl.textContent=`❌ Wrong! Answer: ${currentQuestion.answer}`;
  }

  updateDisplay();
  saveUser();
  setTimeout(nextQuestion,900);
}

/* LEADERBOARD */
function loadLeaderboard(){
  fetch('/leaderboard')
    .then(r=>r.json())
    .then(renderLeaderboard)
    .catch(()=>leaderboardList.innerHTML='<li>Error</li>');
}

function renderLeaderboard(data){
  leaderboardList.innerHTML='';
  Object.entries(data)
    .map(([u,v])=>({u, s:v.highScore||0, r:v.currentRankIndex||0}))
    .sort((a,b)=>b.s-a.s)
    .forEach((p,i)=>{
      const li=document.createElement('li');
      li.innerHTML=`${i+1}. <strong>${escapeHtml(p.u)}</strong> — ${p.s} pts`;
      leaderboardList.appendChild(li);
    });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

/* INIT — ORDER MATTERS */
(async function init(){
  setUIEnabled(false);
  createLoginControls();

  const r = await fetch('ranks.json');
  ranks = await r.json();
  sanitizeRankIndex();
  updateDisplay();

  loadLeaderboard();
  loadQuestions();
})();

answerInput.addEventListener('keydown',e=>{ if(e.key==='Enter') checkAnswer(); });
</script>
</body>
</html>
